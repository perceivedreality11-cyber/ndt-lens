name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[ui,dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -q
      - run: ndt demo-data --count 12 --output data/ci
      - run: ndt check-data --data data/ci/dataset.yaml
      - run: ndt demo-workspace --output data/workbench-ci
      - run: ndt predict --demo --source data/ci/images/train/synthetic_00007.png --output outputs/ci
      - run: python -m pip wheel --no-deps --no-build-isolation --no-cache-dir . --wheel-dir dist
