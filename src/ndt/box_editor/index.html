<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
*{box-sizing:border-box}body{margin:0;color:#dce9fa;background:#101a2b;font:14px system-ui}
.tools{display:flex;gap:8px;align-items:center;padding:10px;flex-wrap:wrap}button{background:#20334b;color:#e2efff;border:1px solid #3b5270;padding:7px 12px;border-radius:6px;cursor:pointer}button:disabled{opacity:.4;cursor:default}
#wrap{overflow:auto;max-height:650px;padding:8px;background:#080e19}canvas{display:block;touch-action:none;cursor:crosshair;max-width:none}#hint{color:#96aecb;font-size:12px}
</style>
<div class="tools"><button id="undo">撤销上一个框</button><button id="clear">清空所有框</button><span id="hint">在图像上拖动绘制矩形；坐标按原图保存</span></div><div id="wrap"><canvas id="canvas" aria-label="缺陷矩形标注画布"></canvas></div>
<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let image=new Image(), boxes=[], args={}, scale=1, start=null, draft=null, identity=null, seq=0;
const colors={porosity:'#20d6ad',crack:'#ffb454',inclusion:'#93b7ff'};
function send(type,more={}){parent.postMessage({isStreamlitMessage:true,type,...more},'*')}
function height(){send('streamlit:setFrameHeight',{height:Math.min(canvas.height+78,735)})}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);[...boxes,...(draft?[draft]:[])].forEach((b,i)=>{let [x1,y1,x2,y2]=b.xyxy.map(v=>v*scale);ctx.strokeStyle=colors[b.label]||'#fff';ctx.lineWidth=2;ctx.strokeRect(x1,y1,x2-x1,y2-y1);ctx.font='13px system-ui';ctx.fillStyle=ctx.strokeStyle;ctx.fillText(`${i+1} ${b.label}`,x1+3,Math.max(15,y1-4))});document.getElementById('undo').disabled=!boxes.length;document.getElementById('clear').disabled=!boxes.length}
function fit(){if(!image.naturalWidth)return;scale=Math.min(1,Math.max(250,innerWidth-16)/image.naturalWidth)*(args.zoom||1);canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);draw();height()}
function emit(){send('streamlit:setComponentValue',{value:{image_id:args.image_id,revision:args.revision,boxes,seq:++seq},dataType:'json'})}
function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(image.naturalWidth,(e.clientX-r.left)/scale)),Math.max(0,Math.min(image.naturalHeight,(e.clientY-r.top)/scale))]}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;start=point(e);canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!start)return;const p=point(e);draft={label:args.label,xyxy:[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])],confidence:null};draw()});
canvas.addEventListener('pointerup',()=>{if(draft){let b=draft.xyxy;if((b[2]-b[0])*scale>=3&&(b[3]-b[1])*scale>=3){boxes.push(draft);emit()}}start=null;draft=null;draw()});
canvas.addEventListener('pointercancel',()=>{start=null;draft=null;draw()});
document.getElementById('undo').onclick=()=>{boxes.pop();draw();emit()};document.getElementById('clear').onclick=()=>{boxes=[];draw();emit()};
addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;args=e.data.args;const next=`${args.image_id}:${args.revision}`;if(identity!==next){identity=next;boxes=structuredClone(args.boxes);image.onload=fit;image.src=args.image;seq=0}else fit()});
addEventListener('resize',fit);send('streamlit:componentReady',{apiVersion:1});height();
</script></html>
